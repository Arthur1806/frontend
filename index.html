<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ouvidoria — Monitoramento de Prazos</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- ===== Menu horizontal (topbar) ===== -->
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/dashboard" aria-label="Início">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            <path d="M12 8v8M8 10.5v5M16 10.5v5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-title">Ouvidoria</span>
          <span class="brand-sub">Monitoramento de Prazos</span>
        </div>
      </a>

      <nav class="nav" aria-label="Navegação principal">
        <a class="nav-item active" href="#/dashboard" data-route="dashboard">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 13h6V4H4v9zm0 7h6v-5H4v5zm10 0h6v-9h-6v9zm0-16v5h6V4h-6z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          <span>Dashboard</span>
        </a>
        <a class="nav-item" href="#/processos" data-route="processos">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 5h16v14H4z" stroke="currentColor" stroke-width="1.6"/><path d="M8 3v4M16 3v4M4 9h16" stroke="currentColor" stroke-width="1.6"/></svg>
          <span>Processos</span>
        </a>
        <a class="nav-item" href="#/calendario" data-route="calendario">
          <svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5" width="17" height="15" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 9.5h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span>Calendário</span>
        </a>
        <a class="nav-item" href="#/configuracoes" data-route="configuracoes">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.6"/><path d="M19.4 15a1.65 1.65 0 00.34 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.34 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.34l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 8.5a1.65 1.65 0 00-.34-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.34H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51h.09a1.65 1.65 0 001.82-.34l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.34 1.82v.09a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          <span>Configurações</span>
        </a>
      </nav>

      <div class="topbar-right">
        <div class="search-box" id="globalSearchBox">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.7"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          <input type="text" id="globalSearch" placeholder="Buscar por NUP ou resumo…" />
        </div>
        <div class="sync-status" id="syncStatus" title="Fonte de dados">
          <span class="dot"></span>
          <span class="sync-text">Planilha Excel (simulada)</span>
        </div>
        <button class="btn btn-ghost btn-sm" id="switchModuloBtn" title="Trocar planilha (Ouvidoria / LAI)">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h10M4 12h6M4 17h10M18 15l3 3-3 3M21 18h-8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Trocar planilha</span>
        </button>
        <button class="btn btn-primary" id="refreshBtn">
          <svg viewBox="0 0 24 24" fill="none"><path d="M20 11a8 8 0 10-2.34 5.66M20 5v6h-6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Atualizar dados</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ===== Conteúdo ===== -->
  <main class="main">
    <div class="page-head">
      <div>
        <h1 class="page-title" id="pageTitle">Dashboard</h1>
        <p class="page-subtitle" id="pageSubtitle">Visão geral dos prazos e das ações prioritárias.</p>
      </div>
      <div class="page-head-date" id="pageHeadDate"></div>
    </div>
    <div class="content" id="content">
      <!-- Views renderizadas pelo app.js -->
    </div>
  </main>

  <!-- ===== Modais ===== -->
  <div id="modal-root"></div>

  <script src="js/data.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
